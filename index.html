<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading">
        <div class="loading-box">
            <p class="loading-text">đang tải tin nhắn...</p>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <p class="percent">0%</p>
        </div>
    </div>  

    <main class="letter hidden">
        <section class="page active">
            <div class="top">
                <p class="mail-icon">✉️</p>
                <p class="small-text">ting ting...</p>
            </div>
            <div class="intro">
                <h1>Chị có 1 tin nhắn quan trọng</h1>
                <p class="message">
                    Có vài điều em muốn nói với chị,<br>
                    nhưng em muốn nói 1 cách đặc biệt hơn một chút.
                </p>
            </div>

            <button class="next">Bấm để mở</button>
        </section>
        
        
    </main>
    
    <script src="script.js"></script>
</body>
</html>
